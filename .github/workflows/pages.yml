# Deploys the site to GitHub Pages with a live social card: the kit's
# og-preview workflow screenshots the live map into assets/og-card.jpg every
# 6 hours. The image is never committed. Pages source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 1,7,13,19 * * *'   # after the mesonet-cameras 16:00 MT run
  workflow_dispatch:

jobs:
  pages:
    uses: mt-climate-office/mco-web-style/.github/workflows/og-preview.yml@v1.4.0
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    with:
      site_dir: docs
      url: https://mt-climate-office.github.io/mesonet-photo-explorer/?export=light&dir=W
      image_url: https://mesonet.climate.umt.edu/photos/assets/og-card.jpg
      mode: download
